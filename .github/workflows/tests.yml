name: Tests

on:
  # 在推送和PR时运行测试
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # 允许手动触发
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }} Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit tests
      run: composer test

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv

    - name: Cache Composer packages
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.1-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.1-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check PHP syntax
      run: find src tests -name "*.php" -exec php -l {} \; && php -l bin/pure

    - name: Run PHP CS Fixer
      run: composer cs-check

    - name: Run PHPStan
      run: composer phpstan

    - name: Smoke test the examples
      run: |
        php bin/pure compile --plain examples
        php bin/pure compile --check --plain examples
        php bin/pure check --strict examples
        for route in /cover /pure/features /plain/features /pure/pricing /plain/pricing; do
          if REQUEST_URI="$route" php examples/bootstrap/public/index.php | grep -q '<h1>404</h1>'; then
            echo "route $route fell back to the 404 page"
            exit 1
          fi
        done
        for route in /index.php /pure /plain; do
          if REQUEST_URI="$route" php examples/event-counter/public/index.php | grep -q '<h1>404</h1>'; then
            echo "route $route fell back to the 404 page"
            exit 1
          fi
        done
        php examples/event-counter/public/index.php | grep -q '<h1>JavaScript Counter App</h1>' || exit 1
        for route in /index.php /pure /plain; do
          if REQUEST_URI="$route" php examples/xml/public/index.php | grep -q '<routes '; then
            echo "route $route fell back to the 404 page"
            exit 1
          fi
        done
        php examples/xml/public/index.php | grep -q '<?xml' || exit 1
        REQUEST_URI=/pure php examples/xml/public/index.php | grep -q '<customers' || exit 1
        php examples/xml/write.php > /dev/null
        grep -q '<customers' examples/xml/example.xml

  docs:
    runs-on: ubuntu-latest
    name: Docs build

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        coverage: none

    - name: Install dependencies
      run: npm ci
      working-directory: site

    - name: Check documentation quality
      run: npm run docs:qa
      working-directory: site
      env:
        DOCS_QA_REQUIRE_PHP: '1'
        DOCS_QA_STRICT: '1'

    - name: Build docs (VitePress + llms.txt link check)
      run: npm run docs:build
      working-directory: site
